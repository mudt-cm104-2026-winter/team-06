<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Movie Ratings</title>
  <link rel="stylesheet" href="/static/style.css">
</head>

<body>
  <main>
    <h1>Movie Ratings</h1>
    <p class="intro">Which movies did we watch, and how good were they?</p>

    <form class="add" action="/add" method="post">
      <input name="title" placeholder="Movie title" required autocomplete="off" autofocus>
      <input name="rating" type="number" placeholder="Rating (1-5)" required>
      <input name="person" placeholder="Who?" required autocomplete="off">
      <button type="submit">Add</button>
    </form>

    {% if entries %}
    <table>
      <thead>
        <tr>
          <th>Movie</th>
          <th>Rating</th>
          <th>Who</th>
        </tr>
      </thead>
      <tbody>
        {% for entry in entries %}
        <tr>
          <td>{{ entry.title }}</td>
          <td>{{ entry.rating }}</td>
          <td>{{ entry.person }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    {% else %}
    <p class="empty">No ratings yet.</p>
    {% endif %}
  </main>
</body>

</html>
